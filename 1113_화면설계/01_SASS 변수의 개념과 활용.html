<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01_SASS 변수의 개념과 활용</title>
  <link href="./css/style.css" rel="stylesheet" type="text/css">
</head>
<body>
  <h2>01_SASS 변수의 개념과 활용</h2>
  <pre>
    문법
    -
    $변수명 : 값;
  </pre>
  <p>'숫자', '문자', '색상', 'bool(true, false)', '리스트', null 값 선언 가능</p>

  <h3>변수의 범위</h3>
  <ul>
    <li>전역변수 - 문서 안에서 바로 작성한 변수, 모든 범위(요소)에 사용 가능</li>
    <li>지역변수 - 특정 코드 블럭({})에서 작성한 변수, 해당 코드 블럭을 벗어나면 사용 불가</li>
  </ul>

  <header>
    <h1>로고</h1>
  </header>

  <main>
    <section>
      <h2>섹션 제목</h2>
    </section>
  </main>

  <footer>
    <address>하단</address>
  </footer>
  
</body>
</html>
